<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E85D9E">
<title>FOR YOU — متجر الهدايا</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Baloo+Bhaijaan+2:wght@600;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--pink:#F5A6C8;--dp:#E85D9E;--lp:#FFF0F6;--w:#fff;--y:#FFF1A8;--t:#37313A;--c:#fff;--m:#8a7a86;
--bg:#fbf6f9;--bd:#f0dfe8;--sh:0 1px 2px rgba(80,30,60,.05),0 10px 28px rgba(80,30,60,.07);
--ok:#16855a;--okb:#e2f5ec;--wa:#a86a08;--wab:#fff3d1;--bad:#c0392b;--badb:#fdeaea;--inf:#2f64c9;--infb:#e5edfc;--vio:#7a4fd0;--viob:#eee8fb;--tea:#0c7f83;--teab:#dcf3f3;--mu:#6d6270;--mub:#f1ecf0;
color-scheme:light}
:root[data-theme="dark"]{--lp:#2b1f27;--w:#231a20;--t:#fbeaf2;--c:#2d2128;--m:#c9a9ba;--bg:#171015;--bd:#3d2c37;--sh:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
--okb:#123a2b;--ok:#55d6a0;--wab:#41330f;--wa:#f0c36a;--badb:#431c1c;--bad:#ff8a7d;--infb:#182a4b;--inf:#8fb2ff;--viob:#2b2147;--vio:#b9a0ff;--teab:#0f3636;--tea:#6fd8da;--mub:#33292f;--mu:#cdbcc6;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.65 Tajawal,Tahoma,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0)}
h1,h2,h3,h4{font-family:'Baloo Bhaijaan 2',Tajawal,sans-serif;margin:0;font-weight:800}
h2{font-size:21px;margin-bottom:10px}h3{font-size:16px;margin:12px 0 6px}
button,input,select,textarea{font-family:inherit}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
.sm{font-size:12.5px;color:var(--m)}.pr{color:var(--dp);font-weight:700}.low{color:var(--bad)}.ctr{text-align:center}.mt{margin-top:12px}.ok{color:var(--ok)}
a{color:inherit}
/* ===== buttons / inputs ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--dp),#cf4b88);color:#fff;padding:9px 16px;font-weight:700;font-size:14px;cursor:pointer;margin:2px;box-shadow:0 4px 12px rgba(232,93,158,.25);transition:.15s;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}.btn:active{transform:none}
.btn.a{background:var(--y);color:#4a2038;box-shadow:none}
.btn.g{background:var(--w);color:var(--dp);border:1.5px solid var(--bd);box-shadow:none}.btn.g:hover{border-color:var(--pink);background:var(--lp)}
.btn.r{background:var(--badb);color:var(--bad);box-shadow:none}
.btn.k{background:var(--okb);color:var(--ok);box-shadow:none}
.btn.s{padding:5px 10px;font-size:12.5px;border-radius:10px;margin:1px}
.btn.ic{padding:7px;border-radius:10px}.btn:disabled{opacity:.45;pointer-events:none}
body.sf .btn{border-radius:999px}
input,select,textarea{width:100%;border:1.5px solid var(--bd);border-radius:12px;padding:9px 12px;font-size:14.5px;background:var(--w);color:var(--t);margin:3px 0 8px;outline:0;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--dp);box-shadow:0 0 0 3px color-mix(in srgb,var(--pink) 35%,transparent)}
body.sf input,body.sf select,body.sf textarea{border:2px solid var(--pink);border-radius:14px}
input[type=checkbox],input[type=radio]{width:18px;height:18px;margin:0 0 0 8px;accent-color:var(--dp);vertical-align:middle}
input[type=color]{padding:2px;height:40px;cursor:pointer}input[type=file]{padding:7px}
label{font-size:13px;font-weight:700;display:block;color:var(--t)}label.ck{display:flex;align-items:center;gap:8px;font-weight:500;padding:6px 0;cursor:pointer}
.hint{font-size:12px;color:var(--m);margin:-4px 0 8px;display:block;font-weight:400}
.tag,.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:99px;background:var(--lp);color:var(--dp);font-size:12px;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--okb);color:var(--ok)}.chip.wa{background:var(--wab);color:var(--wa)}.chip.bad{background:var(--badb);color:var(--bad)}.chip.inf{background:var(--infb);color:var(--inf)}.chip.vio{background:var(--viob);color:var(--vio)}.chip.tea{background:var(--teab);color:var(--tea)}.chip.mu{background:var(--mub);color:var(--mu)}
.tag{background:var(--y);color:#4a2038}
/* ===== placeholders & thumbs ===== */
.ph{display:grid;place-items:center;background:linear-gradient(135deg,var(--lp),var(--pink));color:#fff;width:100%;height:100%}
.ph svg{width:42%;height:42%;stroke-width:1.5;opacity:.9}
.th1{width:44px;height:44px;border-radius:12px;overflow:hidden;flex:none;background:var(--lp);border:1px solid var(--bd)}.th1 img{width:100%;height:100%;object-fit:cover;display:block}
.th1.c{border-radius:50%}
.stk{display:flex}.stk .th1{width:34px;height:34px;border-radius:10px;margin-inline-start:-10px;border:2px solid var(--w)}.stk .th1:first-child{margin-inline-start:0}
.cellp{display:flex;align-items:center;gap:10px;min-width:160px}.cellp b{display:block;line-height:1.35}
/* ===== modal ===== */
#dr{position:fixed;inset:0;background:rgba(30,18,26,.55);backdrop-filter:blur(3px);display:none;z-index:60;align-items:center;justify-content:center;padding:18px}#dr.o{display:flex}
#pn{background:var(--w);color:var(--t);width:100%;max-width:640px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.4);animation:mi .22s both}#pn.wide{max-width:920px}
@keyframes mi{from{opacity:0;transform:translateY(14px) scale(.98)}}
.mh{position:sticky;top:0;z-index:3;background:var(--w);display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--bd)}.mh h2{font-size:19px;margin:0;margin-inline-end:auto}
.mb{padding:16px 20px 20px}.mf{position:sticky;bottom:0;background:var(--w);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--bd);display:flex;gap:6px;flex-wrap:wrap}
@media(max-width:700px){#dr{align-items:flex-end;padding:0}#pn{border-radius:22px 22px 0 0;max-height:94vh;max-height:94dvh}}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.fg .full{grid-column:1/-1}@media(max-width:600px){.fg{grid-template-columns:1fr}}
.fsec{grid-column:1/-1;font-weight:800;color:var(--dp);margin:10px 0 4px;padding-top:10px;border-top:1px dashed var(--bd);font-size:14px}.fsec:first-child{border:0;margin-top:0;padding-top:0}
.up{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 10px}
.up .tile{position:relative;width:96px;height:96px;border-radius:14px;overflow:hidden;border:1.5px solid var(--bd);background:var(--lp)}.up .tile img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.up .tile .x{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:rgba(30,18,26,.72);color:#fff;border:0;cursor:pointer;display:grid;place-items:center;padding:0}
.up .tile .mk{position:absolute;bottom:0;inset-inline:0;background:rgba(232,93,158,.92);color:#fff;font-size:11px;text-align:center;padding:2px;border:0;cursor:pointer;width:100%}
.up .tile.main{outline:2.5px solid var(--dp)}
.up .add{width:96px;height:96px;border-radius:14px;border:2px dashed var(--pink);display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;color:var(--dp);background:var(--lp);cursor:pointer;font-size:12px;font-weight:700;padding:4px;text-align:center}.up .add:hover{background:color-mix(in srgb,var(--pink) 25%,var(--lp))}
.up.rnd .tile,.up.rnd .add{border-radius:50%}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(10px);background:#2b1c27;color:#fff;padding:10px 20px;border-radius:14px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:90;max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}#toast.on{opacity:1;transform:translateX(-50%)}
.ln{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed var(--bd);font-size:14px;align-items:center}.ln:last-child{border:0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:thin}.tabs .btn{white-space:nowrap}
.seg{display:inline-flex;background:var(--mub);border-radius:12px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}.seg button{border:0;background:none;padding:6px 14px;border-radius:9px;font-size:13px;font-weight:700;color:var(--m);cursor:pointer;white-space:nowrap}.seg button.on{background:var(--w);color:var(--dp);box-shadow:0 1px 4px rgba(0,0,0,.1)}
/* ===== staff shell ===== */
.shell{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;background:linear-gradient(180deg,#2f1e2b 0%,#231520 100%);color:#f4e2ec;padding:18px 12px 14px;display:flex;flex-direction:column;gap:2px;z-index:50}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 16px;margin-bottom:4px;border-bottom:1px solid rgba(255,255,255,.09)}
.brand b{font-family:'Baloo Bhaijaan 2',sans-serif;font-size:27px;color:#fff;text-shadow:2px 2px 0 var(--dp);line-height:1.2}.brand small{display:block;color:#caa3b7;font-size:11.5px}.brand img{height:40px;max-width:150px;object-fit:contain}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:11px;color:#a98698;padding:14px 12px 4px;font-weight:700}
.nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;color:#ead2df;padding:9px 12px;border-radius:12px;font-size:14.5px;cursor:pointer;text-align:start;transition:.15s;position:relative}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button.on{background:linear-gradient(135deg,var(--dp),#c94a86);color:#fff;box-shadow:0 8px 18px rgba(232,93,158,.32);font-weight:700}
.nav button .bdg{margin-inline-start:auto;background:#ffd166;color:#4a2a00;border-radius:99px;font-size:11px;font-weight:800;padding:0 7px;line-height:18px}
.me{margin-top:auto;border-top:1px solid rgba(255,255,255,.09);padding:14px 8px 0;display:flex;gap:10px;align-items:center}.me b{display:block;font-size:14px;color:#fff;line-height:1.3}.me small{color:#caa3b7;font-size:12px}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--dp));display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;flex:none}
.side .lo{margin-inline-start:auto;background:rgba(255,255,255,.08);border:0;color:#ead2df;border-radius:10px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer}.side .lo:hover{background:rgba(255,255,255,.16)}
.mainc{min-width:0}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:12px 26px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
.top h1{font-size:23px}.top .mb-btn{display:none}
.content{padding:20px 26px 70px;max-width:1320px;margin:auto}
.scrim{display:none}
@media(max-width:980px){.shell{display:block}.side{position:fixed;top:0;bottom:0;right:0;width:285px;transform:translateX(105%);transition:.28s;box-shadow:-20px 0 60px rgba(0,0,0,.4)}.side.o{transform:none}.scrim.o{display:block;position:fixed;inset:0;background:rgba(20,10,16,.5);z-index:45}.top{padding:10px 14px}.top .mb-btn{display:inline-flex}.top h1{font-size:19px}.content{padding:14px 14px 70px}}
.cd{background:var(--w);border:1px solid var(--bd);border-radius:18px;box-shadow:var(--sh);padding:18px;margin-bottom:16px}
.cd>.hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}.cd>.hd h3{font-size:17px;margin:0;margin-inline-end:auto}.cd>.hd p{margin:0}
.cd.pad0{padding:0;overflow:hidden}.cd.pad0>.hd{padding:16px 18px 0}
.tool{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.tool>*{margin:0!important}.tool input[type=search],.tool .sr{flex:1;min-width:180px}.tool select{width:auto;min-width:130px}
.sr{position:relative}.sr svg{position:absolute;top:50%;transform:translateY(-50%);inset-inline-start:12px;color:var(--m);width:18px;height:18px}.sr input{padding-inline-start:38px;margin:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--w);border:1px solid var(--bd);border-radius:18px;padding:16px;box-shadow:var(--sh);display:flex;gap:13px;align-items:center;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;inset-inline-end:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:var(--lp);opacity:.7}
.kpi .ib{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--lp);color:var(--dp);flex:none;z-index:1}
.kpi .ib.g{background:var(--okb);color:var(--ok)}.kpi .ib.y{background:var(--wab);color:var(--wa)}.kpi .ib.b{background:var(--infb);color:var(--inf)}.kpi .ib.v{background:var(--viob);color:var(--vio)}
.kpi div{z-index:1;min-width:0}.kpi small{color:var(--m);display:block;font-size:12.5px;line-height:1.3}.kpi b{font-size:20px;display:block;line-height:1.35;white-space:nowrap}
.g2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}@media(max-width:900px){.g2{grid-template-columns:1fr}}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:14px;background:var(--w)}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
.t th{background:var(--lp);color:var(--m);font-size:12px;font-weight:700;padding:10px 12px;text-align:start;white-space:nowrap;border-bottom:1px solid var(--bd)}
.t td{padding:10px 12px;border-bottom:1px solid var(--bd);vertical-align:middle}
.t tr:last-child td{border-bottom:0}.t tbody tr:hover td{background:color-mix(in srgb,var(--lp) 55%,transparent)}.t td.act{white-space:nowrap}.t td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{text-align:center;padding:36px 14px;color:var(--m)}.empty svg{width:42px;height:42px;opacity:.5;margin-bottom:6px}
.bar{height:9px;border-radius:9px;background:var(--mub);overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--pink),var(--dp))}
.pipe{display:grid;gap:9px}.pipe .r{display:grid;grid-template-columns:130px 1fr 34px;gap:10px;align-items:center;font-size:13px}.pipe .r b{text-align:end}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;margin-bottom:14px;font-size:14px}.alert.wa{background:var(--wab);color:var(--wa)}.alert.inf{background:var(--infb);color:var(--inf)}.alert.bad{background:var(--badb);color:var(--bad)}.alert.ok{background:var(--okb);color:var(--ok)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.cc{background:var(--w);border:1px solid var(--bd);border-radius:16px;overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column}
.cc .pic2{aspect-ratio:4/3;background:var(--lp);overflow:hidden}.cc .pic2 img{width:100%;height:100%;object-fit:cover;display:block}.cc .bd{padding:12px;flex:1}.cc .ft{padding:8px 10px;border-top:1px solid var(--bd);display:flex;flex-wrap:wrap;gap:2px}
.hb{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px;border:1px solid var(--bd);border-radius:14px;background:var(--w);margin-bottom:8px}.hb.off{opacity:.55}.hb .gr{display:flex;flex-direction:column}.hb .nm{flex:1;min-width:150px}.hb .nm b{display:block}
.sw{position:relative;width:42px;height:24px;flex:none}.sw input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}.sw i{position:absolute;inset:0;border-radius:99px;background:#d5c8cf;transition:.2s}.sw i::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}.sw input:checked+i{background:var(--dp)}.sw input:checked+i::after{inset-inline-start:21px}
.login{max-width:430px;margin:6vh auto;padding:0 14px}.login .cd{padding:26px}.login .lg{text-align:center;margin-bottom:12px}.login .lg b{font-family:'Baloo Bhaijaan 2';font-size:40px;color:var(--dp);text-shadow:3px 3px 0 var(--pink);line-height:1.2}
.ob{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}@media(max-width:1000px){.ob{grid-template-columns:1fr}}
.ob .rt{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto}@media(max-width:1000px){.ob .rt{position:static;max-height:none}}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pk{background:var(--w);border:1px solid var(--bd);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:.15s;text-align:start;padding:0;color:inherit}.pk:hover{border-color:var(--pink);transform:translateY(-2px);box-shadow:var(--sh)}.pk:disabled{opacity:.45}
.pk .im{aspect-ratio:1;background:var(--lp);overflow:hidden;position:relative}.pk .im img{width:100%;height:100%;object-fit:cover}.pk .im .pls{position:absolute;bottom:6px;inset-inline-end:6px;width:28px;height:28px;border-radius:50%;background:var(--dp);color:#fff;display:grid;place-items:center;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.pk .tx{padding:8px 10px;font-size:13px;line-height:1.35}
.cl{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--bd)}.cl .nm{flex:1;min-width:0;font-size:13.5px;line-height:1.4}.cl .q{display:flex;align-items:center;gap:4px}
.cust-th{display:inline-block;width:46px;height:46px;border-radius:10px;overflow:hidden;vertical-align:middle;border:1px solid var(--bd);cursor:zoom-in}.cust-th img{width:100%;height:100%;object-fit:cover}
.tl{position:relative;padding-inline-start:22px;margin:6px 0}.tl::before{content:"";position:absolute;inset-inline-start:7px;top:6px;bottom:6px;width:2px;background:var(--bd)}.tl .e{position:relative;padding:4px 0 10px}.tl .e::before{content:"";position:absolute;inset-inline-start:-20px;top:9px;width:12px;height:12px;border-radius:50%;background:var(--dp);border:2px solid var(--w);box-shadow:0 0 0 2px var(--pink)}
.bkc{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.bkc .cd{margin:0}.bkc .big{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:var(--lp);color:var(--dp);margin-bottom:10px}
/* ===== store ===== */
body.sf{background:var(--lp)}
header#hdr{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--w) 92%,transparent);backdrop-filter:blur(10px);display:flex;align-items:center;gap:8px;padding:10px 14px;box-shadow:0 4px 18px rgba(232,93,158,.14)}
.logo{font-family:'Baloo Bhaijaan 2',sans-serif;font-weight:800;font-size:26px;color:var(--dp);text-shadow:2px 2px 0 var(--pink);margin-inline-end:auto;cursor:pointer;display:flex;align-items:center;line-height:1.2}.logo img{height:38px;max-width:160px;object-fit:contain}
a.s{font-size:12px;color:var(--m);cursor:pointer;text-decoration:underline}
main{max-width:1000px;margin:auto;padding:0 14px 50px}section{margin-top:22px}
.hero{margin-top:14px;border-radius:26px;overflow:hidden;position:relative;min-height:190px;background:linear-gradient(135deg,var(--pink),#ffd3e6);color:#4a2038}
